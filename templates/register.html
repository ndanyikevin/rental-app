<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register — RentFlow</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-indigo-600 to-purple-700 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md p-8">
    <div class="text-center mb-6">
      <div class="text-4xl mb-2">🏠</div>
      <h1 class="text-2xl font-bold text-slate-800">Create Account</h1>
      <p class="text-slate-500 text-sm">Start managing your rentals</p>
    </div>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for cat,msg in messages %}
      <div class="mb-3 px-4 py-2 rounded-lg text-sm
           {{ 'bg-green-100 text-green-800' if cat=='success' else 'bg-red-100 text-red-800' }}">
        {{ msg }}
      </div>
      {% endfor %}
    {% endwith %}

    <form method="POST" class="space-y-3">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input name="username" value="{{ username or '' }}" required
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Email</label>
        <input name="email" type="email" value="{{ email or '' }}" required
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input name="password" type="password" required minlength="8"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
        <p class="text-xs text-slate-400 mt-1">At least 8 characters</p>
      </div>
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Confirm Password</label>
        <input name="confirm_password" type="password" required minlength="8"
               class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-indigo-500 outline-none">
      </div>
      <button class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-2.5 rounded-lg transition mt-2">
        Create Account
      </button>
    </form>

    <p class="text-center text-sm text-slate-500 mt-6">
      Already have an account?
      <a href="{{ url_for('auth.login') }}" class="text-indigo-600 font-medium">Sign In</a>
    </p>
  </div>
</body>
</html>
